<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketchbook · Atelier</title>
<style>
:root{color-scheme:dark;--bg:#090a0c;--panel:#111317;--ink:#e1e4e9;--muted:#8f959f;--line:#292d34}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}header{padding:17px 24px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line)}h1{font-size:14px;font-weight:500;margin:0;flex:1}button,select,a{font:inherit;color:inherit}button,select{background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:6px}button{cursor:pointer}button:hover{border-color:#727984}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #aabdd8;outline-offset:3px}button:disabled{opacity:.45;cursor:default}main{padding:24px;max-width:1800px;margin:auto}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.tools span{color:var(--muted);margin-left:auto}.stage{position:relative;width:100%;aspect-ratio:8/5;background:#07070a;border:1px solid var(--line);overflow:hidden}canvas{width:100%;height:100%;display:block}.viewport{overflow:auto}.viewport.zoom .stage{width:var(--page-width,1600px)}.viewport:focus-visible{outline:2px solid #aabdd8;outline-offset:3px}.review{display:grid;grid-template-columns:220px 1fr;gap:28px;margin-top:20px}.review h2{font-size:12px;font-weight:500;margin:0;color:var(--muted)}#note{max-width:960px;margin:0;white-space:pre-line}.history{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}.history button[aria-pressed=true]{background:#26303c;border-color:#67788c}#status{color:var(--muted);font-variant-numeric:tabular-nums}#error{color:#efaaa4;white-space:pre-wrap}@media(max-width:700px){header{padding:12px;flex-wrap:wrap}main{padding:12px}.review{grid-template-columns:1fr;gap:8px}.tools span{margin-left:0}.stage{border:0}h1{min-width:160px}}
</style></head><body>
<header><h1 id="title">Sketchbook · Atelier</h1><span id="status" role="status" aria-live="off">Loading marks…</span><a href="studio.html">Drawing studio</a><a href="index.html?book=codex-book#7">Sketchbook</a></header>
<main><div class="tools"><button id="reload">Continue from source</button><button id="replay" disabled>Replay this pass</button><button id="finish" disabled>Finish drawing</button><button id="zoom" disabled aria-pressed="false">Inspect at 100%</button><button id="export" disabled>Export PNG</button><span id="size"></span></div>
<div class="viewport" id="viewport" tabindex="0" role="region" aria-label="Drawing viewport; scroll to inspect when zoomed"><div class="stage" id="stage"><canvas id="canvas" role="img" aria-label="The drawing" aria-describedby="note"></canvas></div></div>
<div class="history" id="history" aria-label="Painting passes"></div><div class="review"><h2>Looking, then working back in</h2><p id="note"></p></div><p id="error" role="alert"></p>
</main><script type="module">
import { MarkEngine } from './mark-engine.js';
import { sanitizeOps, sanitizePageDimensions, sanitizeSurface, limitsForPage } from './validate.js';
const $ = id => document.getElementById(id);
const name = new URLSearchParams(location.search).get('p') || 'codex-rain';
let engine = null, passes = [], selected = 0, allOps = [], lastTime = 0;
let dirty = true, version = 0, replayStart = 0;
let currentSurface;
const ctx = $('canvas').getContext('2d');

function report(error) { $('error').textContent = error.message || String(error); }
function controls(busy) {
  $('reload').disabled = busy;
  for (const id of ['replay', 'finish', 'zoom', 'export']) $(id).disabled = busy || !engine || !passes.length;
  for (const button of $('history').children) button.disabled = busy;
}
function show() {
  if (engine && dirty) { engine.composite(ctx); dirty = false; }
  if (!engine) return;
  const progress = engine.cursor
    ? Math.max(0, Math.min(1, (engine.cursor.elapsed - replayStart) / (engine.total - replayStart || 1)))
    : 1;
  $('status').textContent = engine.cursor
    ? `${engine.phase || 'Drawing'} · ${Math.round(progress * 100)}%`
    : `${allOps.length.toLocaleString()} marks · paused to look`;
}
function paint(ops, allowAppend = false) {
  const prefix = allowAppend && allOps.length <= ops.length
    && allOps.every((op, i) => JSON.stringify(op) === JSON.stringify(ops[i]));
  if (prefix) {
    if (!engine.done) engine.finish();
    if (ops.length > allOps.length) engine.append(ops.slice(allOps.length));
    // An unchanged source leaves both pigment and its resample cache untouched.
  } else engine.load(ops).finish();
  allOps = ops;
  replayStart = 0;
  dirty = true;
}
function select(index) {
  if (!Number.isInteger(index) || !passes[index]) throw Error('That painting pass is unavailable.');
  paint(passes.slice(0, index + 1).flatMap(pass => pass.ops));
  selected = index;
  $('note').textContent = passes[index].note;
  [...$('history').children].forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
  $('error').textContent = '';
  show();
}
function buildPasses(page, dimensions, surface) {
  if (!Array.isArray(page.passes) || !page.passes.length) throw Error('The page needs at least one painting pass.');
  const built = page.passes.map((pass, i) => {
    if (!pass || typeof pass.build !== 'function') throw Error(`Pass ${i + 1} needs a build function.`);
    const ops = pass.build();
    if (!Array.isArray(ops)) throw Error(`Pass ${i + 1} must return an array of marks.`);
    return { name: String(pass.name || `Pass ${i + 1}`), note: String(pass.note || ''), ops };
  });
  const checked = sanitizeOps(built.flatMap(pass => pass.ops), limitsForPage(dimensions, surface));
  if (!checked.ops) throw Error(checked.errors.join('\n'));
  let start = 0;
  const clean = built.map(pass => {
    const ops = checked.ops.slice(start, start + pass.ops.length);
    start += pass.ops.length;
    return { ...pass, ops };
  });
  return { passes: clean, ops: checked.ops };
}
async function load() {
  controls(true);
  $('error').textContent = '';
  try {
    if (!/^[a-zA-Z0-9_-]+$/.test(name)) throw Error('Invalid page module name.');
    const module = await import(`./pages/${name}.js?v=${Date.now()}-${version++}`);
    const page = module.default;
    if (!page || typeof page !== 'object') throw Error('The module must export a page.');
    const dims = sanitizePageDimensions(page.page);
    if (!dims.page) throw Error(dims.errors.join('; '));
    const { surface, errors: surfaceErrors } = sanitizeSurface(page.surface);
    if (surface === null) throw Error('Page surface rejected: ' + surfaceErrors.join('; '));
    const { w, h } = dims.page;
    // A failed edit must leave the last good painting, pass controls and replay intact.
    const candidate = buildPasses(page, dims.page, surface);
    if (!engine || engine.w !== w || engine.h !== h || JSON.stringify(currentSurface) !== JSON.stringify(surface)) {
      const dpr = Math.min(2, Math.sqrt(8000000 / (w * h)));
      const next = new MarkEngine({ width: w, height: h, dpr, surface });
      next.load(candidate.ops).finish();
      engine = next;
      currentSurface = surface;
      allOps = candidate.ops;
      replayStart = 0;
      $('canvas').width = w * dpr;
      $('canvas').height = h * dpr;
      $('stage').style.aspectRatio = `${w}/${h}`;
      $('stage').style.setProperty('--page-width', `${w}px`);
      dirty = true;
    } else paint(candidate.ops, true);
    passes = candidate.passes;
    selected = passes.length - 1;
    $('size').textContent = `${w} × ${h} · ${Number(engine.dpr.toFixed(2))}× pigment resolution`;
    $('title').textContent = String(page.title || 'Sketchbook · Atelier');
    $('canvas').setAttribute('aria-label', String(page.title || 'The drawing'));
    $('history').replaceChildren(...passes.map((pass, i) => {
      const button = document.createElement('button');
      button.textContent = `${i + 1} · ${pass.name}`;
      button.setAttribute('aria-pressed', String(i === selected));
      button.onclick = () => { try { select(i); } catch (error) { report(error); } };
      return button;
    }));
    $('note').textContent = passes[selected].note;
    show();
  } catch (error) {
    report(error);
    if (!engine) $('status').textContent = 'Unable to load drawing';
  } finally { controls(false); }
}
function finish() {
  if (!engine) return;
  if (!engine.done) engine.finish();
  dirty = true;
  show();
}
$('reload').onclick = load;
$('finish').onclick = finish;
$('replay').onclick = () => {
  try {
    if (!engine || !passes[selected]) return;
    const before = passes.slice(0, selected).flatMap(pass => pass.ops);
    engine.load(before).finish();
    replayStart = engine.total;
    engine.append(passes[selected].ops, { animate: true });
    dirty = true;
    show();
  } catch (error) { report(error); }
};
$('zoom').onclick = () => {
  const on = $('viewport').classList.toggle('zoom');
  $('zoom').setAttribute('aria-pressed', String(on));
  $('zoom').textContent = on ? 'Fit to window' : 'Inspect at 100%';
};
$('export').onclick = async () => {
  if (!engine) return;
  $('export').disabled = true;
  try {
    finish();
    const filename = `${name}-pass-${selected + 1}.png`;
    const cv = document.createElement('canvas');
    cv.width = $('canvas').width;
    cv.height = $('canvas').height;
    const c = cv.getContext('2d');
    // Material composites already include their paper. Legacy pigment keeps its original ground.
    if (!currentSurface) {
      c.fillStyle = getComputedStyle($('stage')).backgroundColor;
      c.fillRect(0, 0, cv.width, cv.height);
    }
    c.drawImage($('canvas'), 0, 0);
    const blob = await new Promise(resolve => cv.toBlob(resolve, 'image/png'));
    if (!blob) throw Error('The browser could not export this drawing.');
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (error) { report(error); }
  finally { $('export').disabled = false; }
};
function frame(time) {
  requestAnimationFrame(frame);
  if (engine?.cursor) {
    engine.tick(Math.min(.05, (time - lastTime) / 1000), 8);
    dirty = true;
    show();
  }
  lastTime = time;
}
requestAnimationFrame(frame);
await load();
</script></body></html>
